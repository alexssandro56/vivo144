name: Build Sanakovich APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The repo ships no gradle-wrapper.jar; install the Gradle its wrapper asks for.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Debug signing expects ./debug.keystore, which is not in the repo.
      - name: Create debug keystore
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|> " build.log | head -40 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sanakovich-144FPS-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sanakovich-${{ github.run_number }}
          name: Sanakovich 144FPS Unlocker (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: Sanakovich-144FPS-${{ github.run_number }}.apk
