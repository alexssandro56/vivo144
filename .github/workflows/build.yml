name: Build unified APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|> " build.log | head -60 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Vivo144-Unificado-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unificado-${{ github.run_number }}
          name: Vivo 144Hz Unificado (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: Vivo144-Unificado-${{ github.run_number }}.apk
