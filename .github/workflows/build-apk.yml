name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set).
      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      # Compiler errors as annotations, readable through the REST API.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|> " build.log | head -40 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Vivo144-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vivo144-apk
          path: Vivo144-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vivo 144Hz 3.0 (build ${{ github.run_number }})
          make_latest: true
          files: Vivo144-${{ github.run_number }}.apk
